<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>Ultra IPTV: your playlists</title>
    <style>
      :root { color-scheme: dark; --canvas: #080a10; --surface: #141923; --line: #2b3549; --text: #e6e9f0; --muted: #98a2b6; --accent: #f59e0b; --danger: #f87171; --good: #34d399; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
      main { max-width: 30rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
      .sub { margin: 0 0 1.25rem; color: var(--muted); }
      label { display: block; margin: 0.9rem 0 0.3rem; font-weight: 600; }
      input { width: 100%; padding: 0.7rem 0.8rem; border: 1px solid var(--line); border-radius: 0.6rem; background: var(--surface); color: var(--text); font: inherit; }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .tabs { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
      .tabs button { flex: 1; background: var(--surface); color: var(--text); border: 1px solid var(--line); }
      .tabs button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #111; }
      button { padding: 0.75rem 1rem; border: 0; border-radius: 0.6rem; font: inherit; font-weight: 700; cursor: pointer; }
      .primary { width: 100%; margin-top: 1.25rem; background: var(--accent); color: #111; }
      .primary:disabled { opacity: 0.6; cursor: default; }
      .status { margin-top: 1rem; padding: 0.8rem 1rem; border: 1px solid var(--line); border-radius: 0.6rem; background: var(--surface); }
      .status.good { border-color: var(--good); color: var(--good); }
      .status.bad { border-color: var(--danger); color: var(--danger); }
      .secondary { width: 100%; margin-top: 0.6rem; background: transparent; color: var(--text); border: 1px solid var(--line); }
      .link { display: block; padding: 0.5rem 0; background: none; color: var(--accent); font-weight: 600; text-align: start; }
      .footer { margin-top: 1.25rem; }
      .card { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; padding: 0.8rem 1rem; border: 1px solid var(--line); border-radius: 0.6rem; background: var(--surface); }
      .card-text { flex: 1; min-width: 0; }
      .card-name { font-weight: 700; overflow-wrap: anywhere; }
      .card-sub { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
      .card-actions { display: flex; flex-shrink: 0; flex-direction: column; gap: 0.4rem; }
      .small { padding: 0.45rem 0.8rem; background: transparent; color: var(--text); border: 1px solid var(--line); font-size: 0.875rem; }
      .small.danger { color: var(--danger); }
      .badge { display: inline-block; margin-top: 0.3rem; color: var(--accent); font-size: 0.8125rem; font-weight: 600; }
      .row-button { display: block; width: 100%; margin-top: 0.75rem; padding: 1rem; background: var(--surface); color: var(--text); border: 1px solid var(--line); text-align: start; }
      .id-lines { margin: 0.75rem 0 1rem; }
      .id-line { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
      .id-line:last-child { border-bottom: 0; }
      .id-text { flex: 1; min-width: 0; }
      .id-label { color: var(--muted); font-size: 0.8125rem; }
      .id-value { font-weight: 700; letter-spacing: 0.03em; overflow-wrap: anywhere; text-align: start; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="../src/page/main.ts"></script>
  </body>
</html>
