[package]
name = "ultra-iptv-desktop"
version = "0.9.1"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ultra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
cc = "1"

[dependencies]
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", features = ["gzip", "brotli", "deflate"] }
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
regex = "1"
libc = "0.2"
tauri-plugin-updater = "=2.14.1"

[profile.release]
panic = "abort"
