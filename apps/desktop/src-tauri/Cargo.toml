[package]
name = "ultra-iptv-desktop"
version = "0.9.3"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ultra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
cc = "1"

[dependencies]
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", features = ["gzip", "brotli", "deflate"] }
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
regex = "1"
getrandom = "=0.4.3"
tauri-plugin-updater = "=2.14.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "=0.9.0"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
] }

[profile.release]
panic = "abort"
