# Builds the Windows app (x64 installer) on GitHub's Windows machines. Started by hand from the
# Actions tab; the installer is attached to the run as an artifact (docs/sideloading.md, Windows).
#
# With the repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (the updater key from ~/.ultra-iptv), every run also signs the installer for in-app updates.
name: Windows app

on:
  # Every push to the Windows branch builds while it is being made.
  push:
    branches: [desktop-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm
        run: |
          corepack enable
          corepack pnpm --version

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: libmpv
        run: node scripts/desktop-libmpv.mjs --windows

      - name: Web build
        run: corepack pnpm exec vite build --config apps/web/vite.config.ts --sourcemap false

      - name: Installer
        working-directory: apps/desktop
        shell: pwsh
        # Signed for in-app updates whenever the updater key secrets are there (docs/sideloading.md).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            corepack pnpm exec tauri build --bundles nsis
          } else {
            corepack pnpm exec tauri build --bundles nsis --config '{\"bundle\":{\"createUpdaterArtifacts\":false}}'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UltraIPTV-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
